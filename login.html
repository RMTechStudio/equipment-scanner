<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入 - 設備借還系統</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 32px 24px;
            text-align: center;
        }
        h2 { margin-bottom: 24px; font-size: 1.5rem; }
        .input-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .password-wrapper input {
            padding-right: 44px;
        }
        input:focus { border-color: var(--primary-color); }
        .toggle-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            width: auto;
            padding: 4px;
            margin: 0;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-eye:hover { color: var(--primary-color); }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button[type="submit"]:disabled { background-color: #9ca3af; cursor: not-allowed; }
        #msg { margin-top: 16px; font-size: 0.9rem; font-weight: 600; color: #ef4444; min-height: 20px; }
        .register-box { margin-top: 20px; font-size: 0.9rem; color: #4b5563; }
        .register-box a { color: var(--primary-color); font-weight: 600; text-decoration: none; }
        .register-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 設備系統登入</h2>
    <form id="login-form">
        <div class="input-group">
            <label for="username">帳號</label>
            <input type="text" id="username" required placeholder="請輸入帳號">
        </div>
        <div class="input-group">
            <label for="password">密碼</label>
            <div class="password-wrapper">
                <input type="password" id="password" required placeholder="請輸入密碼">
                <button type="button" class="toggle-eye" id="toggle-pwd" aria-label="顯示或隱藏密碼">
                    <!-- 預設閉眼圖示 -->
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" id="submit-btn">登入</button>
    </form>
    <div id="msg"></div>
    <div class="register-box">
        還沒有帳號嗎？<a href="register.html">立即建立帳號</a>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxj2f3CbNb0Nb1_aCvqQfeznorTDqwy7wOaTwi7wr0J_yyOCzBVelrp2yHdnmMEpSY6Ig/exec";
    const EXPIRE_TIME = 8 * 60 * 60 * 1000;

    // 密碼顯示/隱藏切換
    const pwdInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggle-pwd");
    const eyeIcon = document.getElementById("eye-icon");

    const openEyeSVG = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    const closedEyeSVG = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

    toggleBtn.addEventListener("click", function() {
        if (pwdInput.type === "password") {
            pwdInput.type = "text";
            eyeIcon.innerHTML = openEyeSVG;
        } else {
            pwdInput.type = "password";
            eyeIcon.innerHTML = closedEyeSVG;
        }
    });

    const savedUser = localStorage.getItem("equipment_user");
    const savedTime = localStorage.getItem("equipment_login_timestamp");

    if (savedUser && savedTime && (Date.now() - Number(savedTime) < EXPIRE_TIME)) {
        window.location.href = "index.html";
    } else {
        localStorage.clear();
    }

    document.getElementById("login-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = pwdInput.value;
        const btn = document.getElementById("submit-btn");
        const msg = document.getElementById("msg");

        btn.disabled = true;
        btn.innerText = "驗證中...";
        msg.innerText = "";

        fetch(`${API_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem("equipment_user", data.name);
                localStorage.setItem("equipment_role", data.role);
                localStorage.setItem("equipment_permission", data.permission);
                localStorage.setItem("equipment_login_timestamp", Date.now().toString());
                window.location.href = "index.html";
            } else {
                msg.innerText = data.message || "登入失敗";
                btn.disabled = false;
                btn.innerText = "登入";
            }
        })
        .catch(err => {
            msg.innerText = "系統連線錯誤，請稍後再試";
            btn.disabled = false;
            btn.innerText = "登入";
        });
    });
</script>
</body>
</html>
